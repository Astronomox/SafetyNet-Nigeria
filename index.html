<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SafetyNet Nigeria — National Emergency Response</title>
    <meta name="description" content="AI-powered disaster response platform connecting citizens, responders, and government agencies for real-time crisis management." />
    <meta name="theme-color" content="#060A08" />

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Leaflet CSS (Critical for Maps) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Mapbox GL CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              /* New identity */
              "ink": "#060A08",
              "panel": "#0B120F",
              "panel-2": "#101A15",
              "line": "rgba(140,178,156,0.14)",
              "bone": "#E9F2EC",
              "ash": "#8CA396",
              "mint": "#6CF0B4",
              "naija": "#00915B",
              "flare": "#FF4433",
              "amber": "#FFB020",
              /* Legacy token remap: untouched pages inherit the new palette */
              "primary-blue": "#2BC98F",
              "primary-red": "#FF4433",
              "brand-dark": "#060A08",
              "surface-dark": "#0B120F",
              "brand-light": "#F2F6F3",
              "danger": "#FF4433",
              "success": "#2BC98F",
              "warning": "#FFB020",
            },
            fontFamily: {
              "display": ["Archivo", "sans-serif"],
              "body": ["IBM Plex Sans", "sans-serif"],
              "mono": ["IBM Plex Mono", "monospace"],
            },
            boxShadow: {
              "glass": "0 8px 32px 0 rgba(0,0,0,0.45)",
              "glow-red": "0 0 24px rgba(255,68,51,0.45)",
              "glow-mint": "0 0 24px rgba(108,240,180,0.25)",
            },
            animation: {
              "pulse-slow": "pulse 3s cubic-bezier(0.4,0,0.6,1) infinite",
              "rise": "rise .5s cubic-bezier(.2,.8,.2,1) both",
            },
            keyframes: {
              rise: {
                "0%": { opacity: "0", transform: "translateY(14px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
      }
      html { background: #060A08; }
      body {
        background-color: #060A08;
        color: #E9F2EC;
        min-height: 100vh;
        font-family: "IBM Plex Sans", sans-serif;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
      }
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      .filled { font-variation-settings: 'FILL' 1; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .pt-safe { padding-top: max(var(--sat), 0px); }
      .pb-safe { padding-bottom: max(var(--sab), 0px); }

      /* Display type treatment */
      .display {
        font-family: "Archivo", sans-serif;
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 0.95;
        text-transform: uppercase;
      }
      .eyebrow {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      /* Ops panel surface */
      .ops-panel {
        background: linear-gradient(180deg, rgba(16,26,21,0.85), rgba(11,18,15,0.92));
        border: 1px solid rgba(140,178,156,0.14);
        border-radius: 4px;
      }
      .ops-panel-solid {
        background: #0B120F;
        border: 1px solid rgba(140,178,156,0.14);
        border-radius: 4px;
      }
      /* Corner ticks: command-console framing */
      .ticks { position: relative; }
      .ticks::before, .ticks::after {
        content: ""; position: absolute; width: 10px; height: 10px; pointer-events: none;
      }
      .ticks::before { top: -1px; left: -1px; border-top: 2px solid #6CF0B4; border-left: 2px solid #6CF0B4; }
      .ticks::after { bottom: -1px; right: -1px; border-bottom: 2px solid #6CF0B4; border-right: 2px solid #6CF0B4; }

      .scanline {
        background-image: repeating-linear-gradient(0deg, rgba(108,240,180,0.03) 0px, rgba(108,240,180,0.03) 1px, transparent 1px, transparent 3px);
      }

      input, select, textarea { font-family: "IBM Plex Sans", sans-serif; }
      :focus-visible { outline: 2px solid #6CF0B4; outline-offset: 2px; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
      }
    </style>
  </head>
  <body class="dark">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
